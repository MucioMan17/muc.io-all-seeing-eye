# All-Seeing Eye configuration.
# Installed to /etc/allseeingeye/config.yml — edit there, then:
#   sudo systemctl restart allseeingeye

site_name: "Main House"

server:
  host: 0.0.0.0        # listen on all interfaces (LAN + VPN)
  port: 8080

cameras:
  # Start: one USB webcam plugged into the Pi 500.
  - id: front
    name: "Front Yard"
    source: 0          # /dev/video0
    width: 1280
    height: 720
    fps: 15
    detect:
      mode: motion     # `dnn` = AI object labels (person/car/dog...); the
                       # model downloads itself on first use
      min_area: 600    # raise to ignore small motion (leaves, insects);
                       # outdoors 1500-3000 is a good starting range
      # Mute regions where motion never counts (trees, street, neighbor's
      # yard). Rectangles as fractions of the frame: x/y = top-left corner,
      # w/h = size, all 0.0-1.0. Muted zones show as hatched areas in the UI.
      # ignore:
      #   - {x: 0.0, y: 0.0, w: 1.0, h: 0.30}   # top 30% (tree line / sky)
      #   - {x: 0.75, y: 0.3, w: 0.25, h: 0.4}  # bush on the right edge

  # Scale up: WiFi IP cameras via RTSP — just add more entries.
  #
  # TP-Link Tapo (e.g. C121): create a "camera account" in the Tapo app
  # (Settings -> Advanced Settings -> Camera Account), give the camera a
  # DHCP reservation, then use those credentials here.
  # stream2 = efficient sub-stream (best for detection), stream1 = full 2K.
  #
  # `mac` (optional): the camera's hardware MAC address, from the Tapo app's
  # Device Info page or the label on the camera. With it set, the Pi finds
  # the camera's current IP automatically and follows it if it changes —
  # no DHCP reservation or router access needed. The IP in `source` is then
  # just a placeholder.
  # - id: yard
  #   name: "Yard (Tapo C121)"
  #   source: "rtsp://camuser:campass@192.168.1.50:554/stream2"
  #   mac: "AA:BB:CC:DD:EE:FF"
  #   fps: 10
  #   detect:
  #     mode: dnn
  #     classes: [person, car, dog, cat]
  #
  # Reolink W-series:
  # - id: driveway
  #   name: "Driveway"
  #   source: "rtsp://user:password@192.168.1.51:554/h264Preview_01_sub"
  #   fps: 10

  # No hardware yet? Synthetic test scene with moving objects:
  # - id: demo
  #   name: "Demo (synthetic)"
  #   source: synthetic

recording:
  enabled: true
  dir: /var/lib/allseeingeye/recordings
  pre_seconds: 3       # seconds of video kept from *before* motion started
  post_seconds: 6      # keep rolling this long after motion stops
  max_seconds: 120     # split clips longer than this even if motion continues
  retention_days: 14
  max_disk_percent: 90 # stop starting new clips when the disk is this full

# The other house: link its All-Seeing Eye node in this UI's header.
# Reach it over Tailscale/WireGuard — see docs/MULTISITE.md.
remote_sites: []
# remote_sites:
#   - name: "Lake House"
#     url: "http://lakehouse-pi:8080"

models_dir: /var/lib/allseeingeye/models
