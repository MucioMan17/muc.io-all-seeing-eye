<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All-Seeing Eye</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar">
    <div id="brand">
      <span id="eye">&#128065;</span>
      <h1>ALL-SEEING EYE</h1>
      <span id="site-name"></span>
    </div>
    <nav id="sites"></nav>
    <div id="clock"></div>
  </header>

  <main>
    <section id="grid"></section>
    <aside id="sidebar">
      <h2>Events</h2>
      <div id="events"></div>
    </aside>
  </main>

  <div id="help" class="hidden">
    <div id="help-body">
      <h3>KEYBOARD CONTROLS</h3>
      <table>
        <tr><td class="key">1–9 &nbsp;or&nbsp; ← →</td><td>switch camera</td></tr>
        <tr><td class="key">Tab &nbsp;or&nbsp; ↑ ↓</td><td>select next object</td></tr>
        <tr><td class="key">Enter</td><td>lock / release selected object</td></tr>
        <tr><td class="key">F</td><td>fullscreen the active camera</td></tr>
        <tr><td class="key">E</td><td>events list (↑↓ browse, Enter play)</td></tr>
        <tr><td class="key">Space, ← →</td><td>pause / seek in clip playback</td></tr>
        <tr><td class="key">Esc</td><td>release / back / close</td></tr>
        <tr><td class="key">H or ?</td><td>show / hide this help</td></tr>
      </table>
    </div>
  </div>

  <div id="modal" class="hidden">
    <div id="modal-body">
      <button id="modal-close">&times;</button>
      <video id="modal-video" controls autoplay></video>
      <div id="modal-caption"></div>
    </div>
  </div>

  <template id="camera-template">
    <div class="camera">
      <div class="cam-header">
        <span class="cam-name"></span>
        <span class="cam-status"></span>
      </div>
      <div class="cam-view">
        <canvas class="cam-canvas"></canvas>
      </div>
      <div class="cam-hint">Tab select &middot; Enter lock &middot; F fullscreen &middot; E events &middot; H help</div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
