<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MUC.IO ALL SEEING EYE</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar">
    <div id="brand">
      <span id="eye">&#128065;</span>
      <h1>MUC.IO ALL SEEING EYE</h1>
    </div>
    <nav id="sites"></nav>
    <button id="addcam-btn" title="add a camera">+ CAMERA</button>
    <button id="update-btn" title="pull the latest version and reinstall">UPDATE</button>
    <div id="clock"></div>
  </header>

  <main>
    <section id="grid"></section>
    <aside id="sidebar">
      <h2>Events</h2>
      <div id="clear-confirm" class="hidden">
        delete <strong>ALL</strong> events? &nbsp;Enter = yes &middot; any key = no
      </div>
      <div id="events"></div>
    </aside>
  </main>

  <div id="addcam" class="hidden">
    <div id="addcam-body">
      <button id="addcam-close" title="close">&times;</button>
      <h3>ADD CAMERA</h3>
      <p class="addcam-hint">For a WiFi/IP camera (e.g. Tapo). Enter the camera
        account you made in the camera's app, then Scan to find it — or type its
        IP in yourself.</p>

      <label>Name <span class="opt">(optional)</span>
        <input id="ac-name" type="text" placeholder="Driveway" autocomplete="off">
      </label>
      <label>Username
        <input id="ac-user" type="text" placeholder="camera account username" autocomplete="off">
      </label>
      <label>Password
        <input id="ac-pass" type="password" placeholder="camera account password" autocomplete="off">
      </label>

      <div class="ac-row">
        <label class="grow">Camera IP
          <input id="ac-ip" type="text" placeholder="192.168.1.50" autocomplete="off">
        </label>
        <button id="ac-scan" type="button">Scan</button>
      </div>
      <select id="ac-found" class="hidden"></select>

      <label>MAC <span class="opt">(recommended — follows IP changes)</span>
        <input id="ac-mac" type="text" placeholder="0C:EF:15:12:3A:18" autocomplete="off">
      </label>

      <div id="ac-msg"></div>
      <div class="ac-actions">
        <button id="ac-cancel" type="button">Cancel</button>
        <button id="ac-add" type="button" class="primary">Add camera</button>
      </div>
    </div>
  </div>

  <div id="modal" class="hidden">
    <div id="modal-body">
      <button id="modal-close">&times;</button>
      <video id="modal-video" controls autoplay></video>
      <div id="modal-caption"></div>
    </div>
  </div>

  <template id="camera-template">
    <div class="camera">
      <div class="cam-header">
        <span class="cam-status"></span>
      </div>
      <div class="cam-view">
        <canvas class="cam-canvas"></canvas>
      </div>
      <div class="cam-hint">
        <b>WASD</b>/arrows move &middot; <b>1-9</b> camera &middot; <b>Tab</b> select object &middot;
        <b>Enter</b> lock/OK &middot; <b>F</b> fullscreen &middot; <b>E</b> events &middot;
        <b>X</b> delete &middot; <b>C</b> clear all &middot; <b>U</b> update &middot;
        <b>Space</b> pause &middot; <b>Esc</b> back
      </div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
