<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MUC.IO ALL SEEING EYE</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="topbar">
    <div id="brand">
      <span id="eye">&#128065;</span>
      <h1>MUC.IO ALL SEEING EYE</h1>
    </div>
    <nav id="sites"></nav>
    <div id="clock"></div>
  </header>

  <main>
    <section id="grid"></section>
    <aside id="sidebar">
      <h2>Events</h2>
      <div id="clear-confirm" class="hidden">
        delete <strong>ALL</strong> events? &nbsp;Enter = yes &middot; any key = no
      </div>
      <div id="events"></div>
    </aside>
  </main>

  <div id="modal" class="hidden">
    <div id="modal-body">
      <button id="modal-close">&times;</button>
      <video id="modal-video" controls autoplay></video>
      <div id="modal-caption"></div>
    </div>
  </div>

  <template id="camera-template">
    <div class="camera">
      <div class="cam-header">
        <span class="cam-status"></span>
      </div>
      <div class="cam-view">
        <canvas class="cam-canvas"></canvas>
      </div>
      <div class="cam-hint">
        <b>1-9/&larr;&rarr;</b> camera &middot; <b>Tab/&uarr;&darr;</b> select &middot;
        <b>Enter</b> lock &middot; <b>F</b> fullscreen &middot; <b>E</b> events &middot;
        <b>X</b> delete &middot; <b>C</b> clear all &middot;
        <b>Space/&larr;&rarr;</b> pause/seek &middot; <b>Esc</b> back
      </div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
